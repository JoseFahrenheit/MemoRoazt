<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="proyecto de Figma" />
    <meta name="author" content="José Carlos Hernández Calderón" />
    <meta name="keywords" content="Roazt: Memorama" />
    <title>MemoRoazt</title>
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Inconsolata&display=swap"
      rel="stylesheet"
    />
    <link href="assets/css/grid.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body onload="shuffleCards()">
    <div class="container main-container">
      <div class="row">
        <header class="header">
          <div class="title-container">
            <h1 class="title-text">MemoRoazt</h1>
          </div>
        </header>
      </div>
      <div class="row">
        <aside class="aside col-2">
          <div class="games-container">
            <h4 class="games-text">Juegos:</h4>
          </div>
          <div class="games-score-container">
            <h4 class="games-score">0</h4>
          </div>
          <div class="matches-container">
            <h4 class="matches-text">Matches:</h4>
          </div>
          <div class="matches-score-container">
            <h4 class="matches-score">0</h4>
          </div>
          <div class="attempts-container">
            <h4 class="attempts-text">Intentos:</h4>
          </div>
          <div class="attempts-score-container">
            <h4 class="attempts-score">0</h4>
          </div>
          <div class="accuracy-container">
            <h4 class="accuracy-text">Accuracy:</h4>
          </div>
          <div class="accuracy-score-container">
            <h4 class="accuracy-score">0%</h4>
          </div>
          <button class="shuffle-button">Reset</button>
          <video autoplay muted loop class="video-bg">
            <source src="./assets/videos/xalapa.mp4" />
          </video>
        </aside>
        <main class="main col-10" id="gameCards">
          <div class="card-item col-2">
            <div class="card-front buster"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front buster"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front nk"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front nk"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front desmond"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front desmond"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front fahren"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front fahren"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front buster__two"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front buster__two"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front desmond__two"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front desmond__two"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front nk__two"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front nk__two"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front fahren__two"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front fahren__two"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front portada"></div>
            <div class="card-back"></div>
          </div>
          <div class="card-item col-2">
            <div class="card-front portada"></div>
            <div class="card-back"></div>
          </div>
        </main>
      </div>
    </div>
    <div class="modal hidden">
      <div class="modal-text">
        <span class="close">&times;</span>
        <h3>¡Felicidades! ¡Has ganado!</h3>
        <a
          href="https://open.spotify.com/intl-es/artist/4yRHD5cxHUaw092cLbRvPf?si=kNkRh1v2RYan-wGXjhLOmw"
          target="_blank"
          class="spotify-button"
          >Escucha el nuevo</a
        >
      </div>
    </div>
    <script src="assets/js/script.js"></script>
  </body>
</html>
